<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Logbook Thermal BNI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .bni-teal { background-color: #005E6A; }
    .bni-orange { background-color: #F15A24; }
    .text-bni-teal { color: #005E6A; }
    .text-bni-orange { color: #F15A24; }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex justify-center">

  <div class="w-full max-w-md bg-white min-h-screen shadow-lg flex flex-col">
    <!-- Header -->
    <header class="bni-teal text-white p-4 sticky top-0 z-20 shadow-md">
      <div class="flex justify-between items-center">
        <div>
          <span class="text-[10px] tracking-wider uppercase font-semibold text-teal-200">BNI Operational Logistics</span>
          <h1 class="text-lg font-bold flex items-center gap-2">
            <i class="fa-solid fa-receipt text-bni-orange"></i> Logbook Thermal
          </h1>
        </div>
        <button onclick="muatDataDariSheet()" title="Refresh Data" class="w-9 h-9 rounded-full bg-teal-800/60 flex items-center justify-center hover:bg-teal-700 active:scale-95 transition">
          <i id="sync-icon" class="fa-solid fa-arrows-rotate text-sm"></i>
        </button>
      </div>

      <!-- Ringkasan Stok -->
      <div class="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-teal-600/50 text-center">
        <div class="bg-teal-800/40 rounded-lg p-2">
          <p class="text-[11px] text-teal-200">Total Masuk</p>
          <p id="total-masuk" class="text-base font-bold">0</p>
        </div>
        <div class="bg-teal-800/40 rounded-lg p-2">
          <p class="text-[11px] text-teal-200">Di Teknisi</p>
          <p id="total-keluar" class="text-base font-bold">0</p>
        </div>
        <div class="bni-orange rounded-lg p-2 shadow-sm">
          <p class="text-[11px] text-orange-100 font-medium">Sisa di Kantor</p>
          <p id="sisa-kantor" class="text-base font-black text-white">0</p>
        </div>
      </div>
    </header>

    <!-- Navigasi Tab -->
    <div class="flex border-b border-slate-200 text-sm font-semibold bg-slate-50">
      <button onclick="gantiTab('input')" id="tab-btn-input" class="flex-1 py-3 text-center border-b-2 border-bni-teal text-bni-teal">
        <i class="fa-solid fa-plus-circle mr-1"></i> Catat
      </button>
      <button onclick="gantiTab('posisi')" id="tab-btn-posisi" class="flex-1 py-3 text-center border-b-2 border-transparent text-slate-500">
        <i class="fa-solid fa-users mr-1"></i> Posisi Teknisi
      </button>
      <button onclick="gantiTab('riwayat')" id="tab-btn-riwayat" class="flex-1 py-3 text-center border-b-2 border-transparent text-slate-500">
        <i class="fa-solid fa-list mr-1"></i> Mutasi
      </button>
    </div>

    <!-- Konten Utama -->
    <main class="p-4 flex-1">
      
      <!-- TAB 1: FORM INPUT -->
      <div id="tab-input" class="space-y-4">
        <!-- Pilihan Tipe -->
        <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
          <button type="button" onclick="setTipe('KELUAR')" id="btn-keluar" class="py-2.5 rounded-lg font-bold text-sm bg-white shadow text-slate-800 transition">
            <i class="fa-solid fa-hand-holding text-amber-500 mr-1"></i> Dibawa Teknisi
          </button>
          <button type="button" onclick="setTipe('MASUK')" id="btn-masuk" class="py-2.5 rounded-lg font-semibold text-sm text-slate-500 hover:text-slate-800 transition">
            <i class="fa-solid fa-box text-emerald-600 mr-1"></i> Thermal Masuk
          </button>
        </div>

        <form id="form-thermal" onsubmit="handleSimpan(event)" class="space-y-3">
          <!-- Tanggal -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
            <input type="date" id="input-tanggal" required class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-600">
          </div>

          <!-- Teknisi (Hanya jika KELUAR) -->
          <div id="wrapper-teknisi">
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Teknisi (Penerima)</label>
            <input type="text" id="input-teknisi" placeholder="Contoh: Budi / Rizki / Marvel" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-600">
          </div>

          <!-- Jumlah Roll -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Jumlah Thermal (Roll)</label>
            <div class="flex gap-2">
              <input type="number" id="input-jumlah" min="1" placeholder="0" required class="flex-1 px-3 py-2 border rounded-lg text-sm bg-white font-bold text-lg focus:outline-none focus:ring-2 focus:ring-teal-600">
            </div>
            <!-- Quick Chips -->
            <div class="flex gap-2 mt-2">
              <button type="button" onclick="isiJumlah(10)" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-xs font-medium rounded-full">+10</button>
              <button type="button" onclick="isiJumlah(20)" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-xs font-medium rounded-full">+20</button>
              <button type="button" onclick="isiJumlah(50)" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-xs font-medium rounded-full">+50</button>
              <button type="button" onclick="isiJumlah(100)" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-xs font-medium rounded-full">+100</button>
            </div>
          </div>

          <!-- Keterangan / Resi -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Keterangan / No. Resi Drop</label>
            <input type="text" id="input-keterangan" placeholder="Contoh: Kiriman BNI Wilayah / Sisa Lapangan" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-600">
          </div>

          <button type="submit" id="btn-submit" class="w-full bni-teal text-white py-3 rounded-lg font-bold text-sm shadow hover:opacity-90 active:scale-[0.99] transition mt-2 flex items-center justify-center gap-2">
            <i class="fa-solid fa-floppy-disk"></i> Simpan Catatan
          </button>
        </form>
      </div>

      <!-- TAB 2: POSISI TEKNISI -->
      <div id="tab-posisi" class="hidden space-y-3">
        <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800 flex items-start gap-2">
          <i class="fa-solid fa-circle-info text-amber-600 mt-0.5"></i>
          <span>Menampilkan total akumulasi roll thermal yang saat ini tercatat dibawa oleh masing-masing teknisi.</span>
        </div>
        <div id="list-posisi" class="divide-y divide-slate-100"></div>
      </div>

      <!-- TAB 3: RIWAYAT MUTASI -->
      <div id="tab-riwayat" class="hidden space-y-3">
        <div class="flex justify-between items-center mb-1">
          <span class="text-xs text-slate-500 font-medium">Log Mutasi Terakhir</span>
          <button onclick="downloadCSV()" class="text-xs text-bni-teal font-semibold flex items-center gap-1 hover:underline">
            <i class="fa-solid fa-file-excel"></i> Export CSV
          </button>
        </div>
        <div id="list-riwayat" class="space-y-2"></div>
      </div>

    </main>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzvmbOcYt5KMNBBBCTK_Ix-WBMzEDEPOHwhzlobPkeWtvFOEA2tAnfSRXezAbod14wfQA/exec";
    let dataThermal = JSON.parse(localStorage.getItem("dataThermalBNI")) || [];
    let currentTipe = "KELUAR";

    document.getElementById("input-tanggal").valueAsDate = new Date();

    function setTipe(tipe) {
      currentTipe = tipe;
      const btnK = document.getElementById("btn-keluar");
      const btnM = document.getElementById("btn-masuk");
      const wrapTeknisi = document.getElementById("wrapper-teknisi");

      if (tipe === "KELUAR") {
        btnK.className = "py-2.5 rounded-lg font-bold text-sm bg-white shadow text-slate-800 transition";
        btnM.className = "py-2.5 rounded-lg font-semibold text-sm text-slate-500 hover:text-slate-800 transition";
        wrapTeknisi.classList.remove("hidden");
        document.getElementById("input-teknisi").required = true;
      } else {
        btnM.className = "py-2.5 rounded-lg font-bold text-sm bg-white shadow text-slate-800 transition";
        btnK.className = "py-2.5 rounded-lg font-semibold text-sm text-slate-500 hover:text-slate-800 transition";
        wrapTeknisi.classList.add("hidden");
        document.getElementById("input-teknisi").required = false;
      }
    }

    function isiJumlah(val) {
      const el = document.getElementById("input-jumlah");
      el.value = (Number(el.value) || 0) + val;
    }

    function gantiTab(tab) {
      ["input", "posisi", "riwayat"].forEach(t => {
        document.getElementById("tab-" + t).classList.add("hidden");
        document.getElementById("tab-btn-" + t).className = "flex-1 py-3 text-center border-b-2 border-transparent text-slate-500";
      });
      document.getElementById("tab-" + tab).classList.remove("hidden");
      document.getElementById("tab-btn-" + tab).className = "flex-1 py-3 text-center border-b-2 border-bni-teal text-bni-teal font-bold";
      if (tab === "posisi") renderPosisi();
      if (tab === "riwayat") renderRiwayat();
    }

    async function handleSimpan(e) {
      e.preventDefault();
      const btn = document.getElementById("btn-submit");
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';

      const payload = {
        tanggal: document.getElementById("input-tanggal").value,
        tipe: currentTipe,
        pic: currentTipe === "KELUAR" ? document.getElementById("input-teknisi").value.trim() : "Gudang Kantor",
        jumlah: Number(document.getElementById("input-jumlah").value),
        keterangan: document.getElementById("input-keterangan").value.trim() || "-"
      };

      // Simpan lokal dulu
      dataThermal.unshift(payload);
      localStorage.setItem("dataThermalBNI", JSON.stringify(dataThermal));
      renderSemua();

      // Kirim online ke Google Sheets
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        alert("Berhasil dicatat & disinkronkan ke Google Sheets!");
        document.getElementById("form-thermal").reset();
        document.getElementById("input-tanggal").valueAsDate = new Date();
        setTipe("KELUAR");
      } catch (err) {
        alert("Tersimpan di HP (offline). Gagal sinkron ke Google Sheets: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Simpan Catatan';
      }
    }

    async function muatDataDariSheet() {
      const icon = document.getElementById("sync-icon");
      icon.classList.add("fa-spin");
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          dataThermal = data.reverse();
          localStorage.setItem("dataThermalBNI", JSON.stringify(dataThermal));
          renderSemua();
        }
      } catch (err) {
        console.log("Offline mode, menggunakan data lokal.");
      } finally {
        icon.classList.remove("fa-spin");
      }
    }

    function renderSemua() {
      let masuk = 0;
      let keluar = 0;

      dataThermal.forEach(item => {
        const jml = Number(item.jumlah) || 0;
        if (item.tipe === "MASUK") masuk += jml;
        else keluar += jml;
      });

      document.getElementById("total-masuk").innerText = masuk.toLocaleString("id-ID");
      document.getElementById("total-keluar").innerText = keluar.toLocaleString("id-ID");
      document.getElementById("sisa-kantor").innerText = (masuk - keluar).toLocaleString("id-ID");
      renderRiwayat();
      renderPosisi();
    }

    function renderPosisi() {
      const el = document.getElementById("list-posisi");
      const rekap = {};

      dataThermal.forEach(item => {
        if (item.tipe === "KELUAR") {
          const nama = item.pic || "Tanpa Nama";
          rekap[nama] = (rekap[nama] || 0) + Number(item.jumlah);
        }
      });

      const keys = Object.keys(rekap);
      if (keys.length === 0) {
        el.innerHTML = '<div class="text-center py-8 text-xs text-slate-400">Belum ada thermal yang dibawa teknisi.</div>';
        return;
      }

      el.innerHTML = keys.sort((a,b) => rekap[b] - rekap[a]).map(nama => `
        <div class="flex justify-between items-center py-3">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-teal-50 text-bni-teal font-bold text-xs flex items-center justify-center">
              ${nama.charAt(0).toUpperCase()}
            </div>
            <div>
              <p class="text-sm font-bold text-slate-800">${nama}</p>
              <p class="text-[11px] text-slate-400">Total diambil</p>
            </div>
          </div>
          <span class="text-sm font-extrabold text-bni-orange bg-orange-50 px-2.5 py-1 rounded-md">
            ${rekap[nama]} Roll
          </span>
        </div>
      `).join("");
    }

    function renderRiwayat() {
      const el = document.getElementById("list-riwayat");
      if (dataThermal.length === 0) {
        el.innerHTML = '<div class="text-center py-8 text-xs text-slate-400">Belum ada catatan mutasi.</div>';
        return;
      }

      el.innerHTML = dataThermal.slice(0, 30).map(item => `
        <div class="bg-slate-50 border rounded-lg p-3 text-xs flex justify-between items-center">
          <div>
            <div class="flex items-center gap-1.5">
              <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${item.tipe === 'MASUK' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-800'}">
                ${item.tipe}
              </span>
              <span class="font-bold text-slate-700">${item.pic || '-'}</span>
            </div>
            <p class="text-[11px] text-slate-400 mt-1">${item.tanggal} • ${item.keterangan || '-'}</p>
          </div>
          <div class="text-right">
            <span class="text-sm font-black ${item.tipe === 'MASUK' ? 'text-emerald-600' : 'text-slate-800'}">
              ${item.tipe === 'MASUK' ? '+' : '-'}${item.jumlah}
            </span>
            <p class="text-[10px] text-slate-400">roll</p>
          </div>
        </div>
      `).join("");
    }

    function downloadCSV() {
      let csv = "\uFEFFTanggal,Tipe,Teknisi/PIC,Jumlah,Keterangan\n";
      dataThermal.forEach(d => {
        csv += `"${d.tanggal}","${d.tipe}","${d.pic || '-'}","${d.jumlah}","${d.keterangan || '-'}"\n`;
      });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Logbook_Thermal_BNI_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    renderSemua();
    muatDataDariSheet();
  </script>
</body>
</html>
